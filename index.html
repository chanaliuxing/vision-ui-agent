<!DOCTYPE html>
<html>
<head>
    <title>My Magic Drawing Board! 🎨</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0ff;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 3px solid purple;
            border-radius: 10px;
            margin: 20px;
            background-color: white;
        }
        .controls {
            margin: 10px;
        }
        button {
            font-size: 16px;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #ff69b4;
            color: white;
        }
        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <h1>My Magic Drawing Board! 🎨</h1>
    <div class="controls">
        <button class="color-btn" style="background-color: red;" onclick="setColor('red')"></button>
        <button class="color-btn" style="background-color: blue;" onclick="setColor('blue')"></button>
        <button class="color-btn" style="background-color: green;" onclick="setColor('green')"></button>
        <button class="color-btn" style="background-color: purple;" onclick="setColor('purple')"></button>
    </div>
    <button onclick="clearCanvas()">Clear Drawing ✨</button>
    <canvas id="drawingBoard" width="600" height="400"></canvas>
    <script src="drawing.js"></script>
</body>
</html>
